<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>啾啾破底翻雷達</title><style>
body{margin:0;background:#f5f6f8;font-family:-apple-system,"PingFang TC",sans-serif;color:#111827}header{background:#111827;color:white;padding:22px 16px}h1{margin:0;font-size:21px}.sub,.note{font-size:12px;color:#6b7280}.sub{color:#cbd5e1;margin-top:5px}.wrap{max-width:700px;margin:auto;padding:14px}.filters{display:flex;gap:8px}.filters button{padding:9px 12px;border:1px solid #ddd;border-radius:20px;background:white}.filters .on{background:#111827;color:white}.card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0000000b}.top{display:flex;justify-content:space-between}.code{font-size:20px;font-weight:800}.badge{background:#ecfdf3;color:#067647;border-radius:20px;padding:6px 9px;font-size:12px;font-weight:700}.wait{background:#fff7ed;color:#b54708}.price{font-size:28px;font-weight:800;margin-top:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.m{background:#f9fafb;border-radius:11px;padding:10px;font-size:12px;color:#6b7280}.m b{display:block;color:#111827;font-size:16px;margin-top:3px}.w{height:110px;position:relative;margin-top:14px;border-radius:12px;background:#fafafa;overflow:hidden}.support,.neck{position:absolute;left:8px;right:8px;border-top:1px dashed #9ca3af;font-size:10px;color:#6b7280}.support{top:78px}.neck{top:25px}.shape{font-size:72px;line-height:105px;text-align:center;font-family:serif;transform:scaleX(1.5);color:#111827}.warning{line-height:1.6}
</style></head><body><header><h1>👑 啾啾破底翻雷達</h1><div class="sub">W型・K棒實體支撐・破底站回・高價股</div></header><main class="wrap">
<div class="filters"><button class="on" onclick="f(500,this)">500元以上</button><button onclick="f(1000,this)">1000元以上</button><button id="v" onclick="vol(this)">只看帶量</button></div>
<p class="note">手機 Web v0.2 原型｜目前顯示示範資料，不是即時買進訊號</p><div id="list"></div>
<div class="card warning"><b>雷達核心規則</b><br>支撐、壓力只看 K 棒實體。左底最低實體＝支撐；兩低點間最高實體＝W頸線；右側需曾以收盤跌破支撐，1–10個交易日內重新站回。量比 ≥1.2× 標記帶量。正式盤中版會把「盤中候選」與「13:30收盤確認」分開。</div></main>
<script>
const D=[["DEMO-A",1280,1195,1370,3,3.2,1.56,7.1],["DEMO-B",760,735,825,2,2.4,1.08,3.4],["DEMO-C",2460,2310,2675,5,5.1,1.31,6.5]];let min=500,ov=false;
function f(n,b){min=n;document.querySelectorAll(".filters button").forEach(x=>{if(x.id!="v")x.classList.remove("on")});b.classList.add("on");r()}function vol(b){ov=!ov;b.classList.toggle("on");r()}
function r(){let e=document.getElementById("list");e.innerHTML="";D.filter(x=>x[1]>=min&&(!ov||x[6]>=1.2)).forEach(x=>{let good=x[6]>=1.2,d=document.createElement("div");d.className="card";d.innerHTML=`<div class=top><span class=code>${x[0]}</span><span class="badge ${good?"":"wait"}">${good?"🔥 帶量破底翻":"🟡 量待確認"}</span></div><div class=price>${x[1].toLocaleString()}</div><div class=note>示範資料・非即時行情</div><div class=grid><div class=m>實體支撐<b>${x[2]}</b></div><div class=m>W頸線<b>${x[3]}</b></div><div class=m>破底後<b>${x[4]} 個交易日</b></div><div class=m>量 / 20日均量<b>${x[6]}×</b></div><div class=m>最大破底<b>-${x[5]}%</b></div><div class=m>站回支撐<b>+${x[7]}%</b></div></div><div class=w><div class=neck>W 頸線 ${x[3]}</div><div class=support>支撐 ${x[2]}</div><div class=shape>W</div></div>`;e.appendChild(d)})}r();
</script></body></html>
